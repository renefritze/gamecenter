[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["_version.py", "docs/conf.py"]
fix = true

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = ["E501", "ANN201", "ANN001", "D211", "D213", "COM812", "D203", "PGH004"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "D103"]

[tool.pytest.ini_options]
addopts = "--cov=my_sample_package --cov-report=term-missing"


[tool.hatch]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/my_sample_package/_version.py"

[tool.hatch.envs.default]
python = "3.10"

[tool.hatch.envs.default.scripts]
test = "pytest"
lint = [
  "ruff format .",
  "ruff check --fix .",
  "ty check src/my_sample_package/",
]

docs-build = "make -C docs html"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "my_sample_package"
authors = [
  { name = "my_sample_package", email = "rene.fritze@arup.com" }
]
description = "A sample Python package created with cookiecutter"
readme = "README.md"
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.10"
dependencies = [ "rich", "packaging", "typer", "click"]

[project.optional-dependencies]
# myst current require sphinx<6
docs = ["sphinx>=8.1.3",
    "sphinx-autoapi>=3",
    "myst-nb>=0.18",
    "furo>=2023.9.10"]
ci = [
    "pytest",
    "pytest-cov",
]
dev = [
    "ty",
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-pycharm",
    "pytest-regressions",
    "pytest-datadir",
    "my_sample_package[docs]",
]


[project.urls]
Documentation = "https://github.com/renefritze/my_sample_package"
Source = "https://github.com/renefritze/my_sample_package"
