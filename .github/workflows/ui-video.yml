---
name: UI video
on:
  push:
    branches: [main]
    # Only regenerate when something that can change the UI tour changes.
    paths:
      - src/**
      - pyproject.toml
      - .github/workflows/ui-video.yml
  workflow_dispatch:
    inputs:
      framerate:
        description: Capture framerate (fps)
        required: false
        default: '25'
      step:
        description: Seconds between scripted UI steps
        required: false
        default: '1.5'

# Don't let two runs race to force-push the media branch.
concurrency:
  group: ui-video-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    env:
      DISPLAY: ':99'
      # Force Mesa software rendering so Kivy gets a GL context under Xvfb.
      LIBGL_ALWAYS_SOFTWARE: '1'
      KIVY_NO_ARGS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --frozen --extra ci
      - name: Install system packages (Xvfb, ffmpeg, Mesa)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11-utils ffmpeg libgl1-mesa-dri libglu1-mesa libmtdev1
      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1280x720x24 +extension GLX +render -noreset &
          # Give Xvfb a moment to come up before anything connects to it.
          for _ in $(seq 1 30); do
            xdpyinfo -display :99 >/dev/null 2>&1 && break
            sleep 0.2
          done
      - name: Record scripted UI tour
        # Pass inputs via env (not direct ${{ }} interpolation) to avoid shell injection.
        # Fall back to defaults so the push trigger (which has no inputs) works too.
        env:
          FRAMERATE: ${{ github.event.inputs.framerate || '25' }}
          STEP: ${{ github.event.inputs.step || '1.5' }}
        run: |
          ffmpeg -y -f x11grab -video_size 1280x720 \
            -framerate "$FRAMERATE" \
            -i :99 -pix_fmt yuv420p ui-demo.mp4 &
          FFMPEG_PID=$!
          # Hard timeout safeguard in case the demo never exits on its own.
          timeout 120 uv run gamecenter demo --backend keyboard --step "$STEP"
          # Stop the recorder gracefully so the MP4 is finalized.
          kill -INT "$FFMPEG_PID"
          wait "$FFMPEG_PID" || true
      - name: Convert recording to an optimized GIF
        run: |
          # Scale down + drop the framerate so the README GIF stays a sane size,
          # and use a per-clip palette for decent colour quality.
          palette=/tmp/ui-demo-palette.png
          filters='fps=12,scale=720:-1:flags=lanczos'
          ffmpeg -y -i ui-demo.mp4 -vf "${filters},palettegen=stats_mode=diff" "$palette"
          ffmpeg -y -i ui-demo.mp4 -i "$palette" \
            -lavfi "${filters},paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
            ui-demo.gif
          ls -lh ui-demo.mp4 ui-demo.gif
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ui-demo-video
          path: |
            ui-demo.mp4
            ui-demo.gif
          if-no-files-found: error
      - name: Publish GIF to the media branch
        # Only update the README asset for real pushes to main (and manual
        # dispatches from main), never from forks where the token is read-only.
        if: github.ref == 'refs/heads/main' && github.event.repository.fork == false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Build the branch as a single orphan commit in a scratch dir so the
          # media branch never accumulates history (force-push keeps it at 1 commit).
          work="$(mktemp -d)"
          cp ui-demo.gif "$work/ui-demo.gif"
          cd "$work"
          git init -q
          git checkout -q -b media
          git add ui-demo.gif
          git commit -q -m "Update UI demo GIF (${GITHUB_SHA})"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            media
